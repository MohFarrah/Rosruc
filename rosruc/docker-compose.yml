# Starter compose setup for local hackathon demos.
# It installs dependencies inside containers on startup and is not production-ready.
services:
  backend:
    image: node:20-alpine
    working_dir: /app/backend
    command: sh -c "npm install && npm run dev"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-sqlite://./backend/data/app.db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me_later}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    volumes:
      - ./backend:/app/backend

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend:/app/frontend
